name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushes to main queue so a long kernel build finishes and lands in the cache; superseded PR runs are canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent:
    name: Guest agent checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: guest/agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: guest/agent/go.mod
          cache-dependency-path: guest/agent/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: GOOS=linux GOARCH=arm64 go vet ./...

  guest:
    name: Guest kernel and initramfs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # Exposes the Actions cache to the buildx CLI, so the kernel is rebuilt only when guest/ changes.
      - uses: crazy-max/ghaction-github-runtime@v3
      # When the kernel config does change, ccache from the previous build makes the rebuild incremental.
      - uses: actions/cache@v6
        id: ccache
        with:
          path: ccache
          key: kernel-ccache-${{ hashFiles('guest/Dockerfile', 'guest/kernel/asl.config') }}
          restore-keys: kernel-ccache-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            { "ccache": { "target": "/ccache", "id": "asl-kernel-ccache" } }
          skip-extraction: ${{ steps.ccache.outputs.cache-hit }}
      - name: Build
        run: guest/build.sh --cache-from type=gha,scope=guest --cache-to type=gha,scope=guest,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: guest-image
          path: |
            app/src/main/assets/vm/Image
            app/src/main/assets/vm/initrd.img
          retention-days: 7

  apk:
    name: Debug APK
    needs: guest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: guest-image
          path: app/src/main/assets/vm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: asl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
